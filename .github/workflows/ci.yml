name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests de lógica pura
        # En UTC a propósito: es la zona del runtime de Vercel y donde estaban
        # los fallos de fecha. Las funciones deben dar el mismo resultado aquí
        # que en Europe/Madrid.
        run: npm test
        env:
          TZ: UTC

      - name: Migraciones y permisos SQL embebidos
        run: npm run test:types

      - name: Build
        # Lo único que detecta errores de RSC/"use client", de metadata y de
        # rutas dinámicas. Sin esto, un build roto solo se descubría en Vercel.
        run: npm run build
        env:
          # Valores de relleno: el build no contacta con Supabase, pero
          # `next.config.ts` lee la URL para construir la CSP.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: clave-de-relleno-para-el-build
          NEXT_PUBLIC_SITE_URL: https://example.invalid

  auditoria:
    name: npm audit (todas las dependencias)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  integracion:
    name: Integración contra Supabase local
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci

      - name: Levantar Supabase local desechable
        run: npx supabase start

      - name: Variables de la instancia local
        run: |
          npx supabase status -o json > supabase-local.json
          node scripts/write-local-env.mjs supabase-local.json

      - name: Batería de integración
        run: npm run test:integration
        env:
          TZ: UTC
