<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1882 983" width="1882" height="983" role="img" aria-label="Captura de la interfaz pendiente de sustituir">
  <rect width="1882" height="983" fill="#f9fbfa"/>
  <rect x="40" y="40" width="1802" height="903" rx="18" fill="#ffffff" stroke="#dce3e3" stroke-width="2" stroke-dasharray="14 12"/>
  <text x="941" y="452" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="600" fill="#172e3a">Captura del panel pendiente</text>
  <text x="941" y="518" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="27" fill="#61717a">Se sustituirá por una recaptura hecha con la cuenta de demostración.</text>
  <text x="941" y="562" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="27" fill="#61717a">La captura entregada mostraba un correo personal real y no se publica.</text>
</svg>
